name: Fix Product Grid And Image Cache

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-two-column-products.yml

permissions:
  contents: write

jobs:
  fix-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix image flicker and preserve layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          text = path.read_text()

          # Repair the known syntax typo from the previous location update.
          text = text.replace('setPadding(dp(16),dp(12),dp(16),dp(112);clipToPadding=false)', 'setPadding(dp(16),dp(12),dp(16),dp(112));clipToPadding=false)')

          # Add Android's LruCache once, keeping the existing networking approach.
          if 'android.util.LruCache' not in text:
              text = text.replace('import android.text.InputType\n', 'import android.text.InputType\nimport android.util.LruCache\n')
          if 'private val imageCache=' not in text:
              text = text.replace('private val mainHandler=Handler(Looper.getMainLooper())', 'private val mainHandler=Handler(Looper.getMainLooper());private val imageCache=LruCache<String,android.graphics.Bitmap>(24)')

          # Replace the old uncached loader. Cached images are shown immediately;
          # newly downloaded images are cached before being assigned to the view.
          old = r' private fun loadImage\(view:ImageView,url:String\)\{.*?\}\n private fun renderProducts'
          new = ''' private fun loadImage(view:ImageView,url:String){
          view.tag=url
          imageCache.get(url)?.let{bmp->view.setImageBitmap(bmp);return}
          imageExecutor.execute{
           try{
            val con=URL(url).openConnection() as HttpURLConnection
            con.connectTimeout=7000;con.readTimeout=7000;con.useCaches=true;con.connect()
            val bmp=BitmapFactory.decodeStream(con.inputStream);con.disconnect()
            if(bmp!=null){imageCache.put(url,bmp);mainHandler.post{if(!isFinishing&&view.tag==url)view.setImageBitmap(bmp)}}
           }catch(_:Exception){}
          }
         }
         private fun renderProducts'''
          text, n = re.subn(old, new, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('loadImage function not found; refusing unsafe modification')

          path.write_text(text)
          PY

      - name: Commit image cache fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix category and product image flicker"
          git push
