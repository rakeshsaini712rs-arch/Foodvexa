name: Fix Product Grid

on:
  push:
    paths:
      - .github/workflows/fix-two-column-products.yml

permissions:
  contents: write

jobs:
  fix-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert product list to two-column cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          text = path.read_text()

          pattern = r' private fun renderProducts\(\)\{.*?\}\n private fun showCart\(\)'
          replacement = r''' private fun renderProducts(){
  val title=if(selectedCategory=="All")"Popular near you" else selectedCategory
  var ti=-1
  for(i in 0 until content.childCount){
   val v=content.getChildAt(i)
   if(v is TextView&&v.text.toString()==title){ti=i;break}
  }
  if(ti<0)return
  while(content.childCount>ti+1)content.removeViewAt(ti+1)
  val filtered=products.filter{(selectedCategory=="All"||it.category==selectedCategory)&&(query.isBlank()||it.name.contains(query,true))}
  var row:LinearLayout?=null
  filtered.forEachIndexed{index,p->
   if(index%2==0){
    row=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.TOP}
    content.addView(row,margin(0,0,0,10))
   }
   val card=LinearLayout(this).apply{
    orientation=LinearLayout.VERTICAL
    setPadding(dp(9),dp(9),dp(9),dp(10))
    background=rounded(Color.rgb(38,29,22),18)
   }
   val pic=ImageView(this).apply{scaleType=ImageView.ScaleType.CENTER_CROP}
   card.addView(pic,LinearLayout.LayoutParams(-1,dp(145)))
   loadImage(pic,p.imageUrl)
   card.addView(label(p.name,16f,true,Color.WHITE),margin(0,8,0,0))
   card.addView(label("🔥 Fresh & Hot  •  ${p.eta}",12f,true,Color.rgb(235,190,75)),margin(0,4,0,0))
   card.addView(label("₹${p.price}",18f,true,Color.rgb(70,210,145)),margin(0,5,0,7))
   card.addView(primaryButton("+ ADD"){addToCart(p)},LinearLayout.LayoutParams(-1,dp(42)))
   row!!.addView(card,LinearLayout.LayoutParams(0,-2,1f).apply{leftMargin=if(index%2==0)0 else dp(5);rightMargin=if(index%2==0)dp(5) else 0})
  }
 }
 private fun showCart()'''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('renderProducts function not found; refusing to modify file')
          path.write_text(new_text)
          PY

      - name: Commit layout change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Make products display two per row"
          git push

# Trigger this one-time repair after the workflow file is installed.
# Re-run repair after the latest app changes.
