name: Build Foodvexa Admin APK

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Admin APK
        run: gradle :admin:assembleDebug
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Admin-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
