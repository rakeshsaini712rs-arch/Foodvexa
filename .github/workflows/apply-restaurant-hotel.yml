name: Apply Restaurant Hotel Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-restaurant-hotel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[restaurant-flow]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s=p.read_text()
          old='box.setOnClickListener{if(selectedCategory!=c.name){selectedCategory=c.name;renderProducts()}}'
          new='box.setOnClickListener{if(c.name=="Restaurant / Hotel"){restaurantHotelDialog()}else if(selectedCategory!=c.name){selectedCategory=c.name;renderProducts()}}'
          if old not in s:
              raise SystemExit('category click pattern not found')
          s=s.replace(old,new,1)
          marker=' private fun showCart(){'
          if 'private fun restaurantHotelDialog()' not in s:
              method=r''' private fun restaurantHotelDialog(){
  val states=listOf("Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal","Andaman and Nicobar Islands","Chandigarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Jammu and Kashmir","Ladakh","Lakshadweep","Puducherry")
  val state=Spinner(this).apply{adapter=ArrayAdapter(this@MainActivity,android.R.layout.simple_spinner_dropdown_item,states)}
  val district=EditText(this).apply{hint="Select District";setSingleLine(true);setPadding(dp(14),0,dp(14),0);background=rounded(Color.rgb(245,245,247),16);setTextColor(ink);setHintTextColor(muted)}
  val city=EditText(this).apply{hint="Select City";setSingleLine(true);setPadding(dp(14),0,dp(14),0);background=rounded(Color.rgb(245,245,247),16);setTextColor(ink);setHintTextColor(muted)}
  val panel=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding(dp(22),dp(4),dp(22),dp(4))}
  panel.addView(label("Select State",13f,true,ink),margin(0,0,0,5));panel.addView(state,margin(0,0,0,12))
  panel.addView(district,margin(0,0,0,12));panel.addView(city,margin(0,0,0,12))
  AlertDialog.Builder(this).setTitle("Restaurant / Hotel 🏨").setView(panel).setNegativeButton("Cancel",null).setPositiveButton("Show Restaurants"){_,_->
    val st=state.selectedItem?.toString().orEmpty();val d=district.text.toString().trim();val c=city.text.toString().trim()
    if(d.isBlank()||c.isBlank()){Toast.makeText(this,"Select District and City",Toast.LENGTH_SHORT).show();return@setPositiveButton}
    Toast.makeText(this,"Searching restaurants in $c, $d, $st",Toast.LENGTH_LONG).show()
  }.show()
 }
'''
              s=s.replace(marker,method+marker,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Add Restaurant Hotel state district city flow [restaurant-flow]'
          git push
