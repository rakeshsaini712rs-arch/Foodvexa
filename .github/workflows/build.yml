name: Build Foodvexa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Birthday Special products
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          if 'Product("Balloon Packet"' not in s:
              marker = 'add(Product("Cupcake",30,"Birthday Special",pizzaImages[1]));'
              additions = (
                  'add(Product("Balloon Packet",80,"Birthday Special","https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=800&q=85"));'
                  'add(Product("Candle",10,"Birthday Special","https://images.unsplash.com/photo-1602631985686-1bb0e6a8696e?auto=format&fit=crop&w=800&q=85"));'
                  'add(Product("Birthday Banner",100,"Birthday Special","https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=800&q=85"));'
                  'add(Product("Party Hats",50,"Birthday Special","https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=800&q=85"));'
                  'add(Product("Birthday Decoration Kit",400,"Birthday Special","https://images.unsplash.com/photo-1519657337289-077653f724ed?auto=format&fit=crop&w=800&q=85"));'
                  'add(Product("Birthday Ribbons",20,"Birthday Special","https://images.unsplash.com/photo-1527529482837-4698179dc6ce?auto=format&fit=crop&w=800&q=85"));'
                  'add(Product("Cake Topper",50,"Birthday Special","https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?auto=format&fit=crop&w=800&q=85"));'
                  'add(Product("Birthday Gift Pack",300,"Birthday Special","https://images.unsplash.com/photo-1513885535751-8b9238bd345a?auto=format&fit=crop&w=800&q=85"));'
              )
              if marker not in s:
                  raise SystemExit("Birthday insertion marker not found")
              s = s.replace(marker, marker + additions, 1)
              p.write_text(s, encoding="utf-8")
              print("Added remaining Birthday Special products")
          else:
              print("Birthday Special products already present")

      - name: Commit source changes back to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Add remaining Birthday Special products [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
