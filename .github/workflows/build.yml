name: Build Foodvexa APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply safe Zomato-style product ticker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text()

          helper = '''
 private fun productBadgeTicker():TextView{
  return TextView(this).apply{
   text="🔥 Fresh & Hot     •     📍 Near & Fast     •     ⚡ Quick Delivery     •     🔥 Fresh & Hot"
   textSize=11f
   setTextColor(Color.rgb(255,196,70))
   typeface=Typeface.DEFAULT_BOLD
   gravity=Gravity.CENTER_VERTICAL
   setPadding(dp(10),0,dp(10),0)
   isSingleLine=true
   ellipsize=android.text.TextUtils.TruncateAt.MARQUEE
   marqueeRepeatLimit=-1
   isSelected=true
   setHorizontallyScrolling(true)
   background=rounded(Color.rgb(57,40,29),12)
  }
 }
'''

          if 'private fun productBadgeTicker()' not in s:
              marker = ' private fun openProductPhoto(p:Product)'
              if marker not in s:
                  raise SystemExit('openProductPhoto marker not found')
              s = s.replace(marker, helper + marker, 1)

          old = '    card.addView(label("• Available",12f,true,Color.rgb(50,205,120)),margin(0,4,0,0))'
          new = '    card.addView(productBadgeTicker(),margin(0,5,0,0))\n    card.addView(label("• Available",12f,true,Color.rgb(50,205,120)),margin(0,5,0,0))'

          if old in s:
              s = s.replace(old, new, 1)
          elif 'card.addView(productBadgeTicker()' not in s:
              raise SystemExit('Available product line not found')

          p.write_text(s)
          PY
          rm -f app/src/main/res/drawable/restaurant_hotel_logo.svg

      - name: Validate source
        run: |
          grep -q 'productBadgeTicker' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'Fresh & Hot' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'Near & Fast' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'Available' app/src/main/java/com/foodvexa/app/MainActivity.kt

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then echo 'No source changes'; else git commit -m 'Add safe Zomato-style product ticker'; git push; fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
