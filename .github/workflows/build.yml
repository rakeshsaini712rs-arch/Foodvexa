name: Build Foodvexa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add Special Sabji products
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          if 'Product("Shahi Paneer",120,"Special Sabji"' not in s:
              items = [
                ("Shahi Paneer",120,"https://images.unsplash.com/photo-1631452180519-c014fe946bc7?auto=format&fit=crop&w=800&q=85"),
                ("Kadai Paneer",120,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Paneer Butter Masala",130,"https://images.unsplash.com/photo-1631452180539-96aca7d48617?auto=format&fit=crop&w=800&q=85"),
                ("Matar Paneer",110,"https://images.unsplash.com/photo-1631452180775-5e8d5f1f1c0f?auto=format&fit=crop&w=800&q=85"),
                ("Palak Paneer",110,"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85"),
                ("Malai Kofta",120,"https://images.unsplash.com/photo-1626132647523-66f5bf380027?auto=format&fit=crop&w=800&q=85"),
                ("Mix Veg",100,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Aloo Gobi",90,"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85"),
                ("Dal Makhani",100,"https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&w=800&q=85"),
                ("Dal Tadka",90,"https://images.unsplash.com/photo-1626500155537-93690c24099f?auto=format&fit=crop&w=800&q=85"),
                ("Chole Masala",90,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Rajma Masala",100,"https://images.unsplash.com/photo-1585937421612-70a008356fbe?auto=format&fit=crop&w=800&q=85"),
                ("Sev Tamatar",90,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Gatte Ki Sabji",100,"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85"),
                ("Ker Sangri",120,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Aloo Pyaz",90,"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85"),
                ("Bhindi Masala",100,"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85"),
                ("Baingan Bharta",100,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Dum Aloo",110,"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85"),
                ("Mushroom Masala",120,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Methi Matar Malai",120,"https://images.unsplash.com/photo-1631452180519-c014fe946bc7?auto=format&fit=crop&w=800&q=85"),
                ("Paneer Tikka Masala",130,"https://images.unsplash.com/photo-1631452180539-96aca7d48617?auto=format&fit=crop&w=800&q=85"),
                ("Achari Paneer",120,"https://images.unsplash.com/photo-1631452180775-5e8d5f1f1c0f?auto=format&fit=crop&w=800&q=85"),
                ("Chilli Paneer",130,"https://images.unsplash.com/photo-1626132647523-66f5bf380027?auto=format&fit=crop&w=800&q=85"),
                ("Mushroom Do Pyaza",120,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Kaju Curry",140,"https://images.unsplash.com/photo-1631452180519-c014fe946bc7?auto=format&fit=crop&w=800&q=85"),
                ("Navratan Korma",130,"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85"),
                ("Veg Kolhapuri",110,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Handi Paneer",130,"https://images.unsplash.com/photo-1631452180539-96aca7d48617?auto=format&fit=crop&w=800&q=85"),
                ("Paneer Do Pyaza",120,"https://images.unsplash.com/photo-1631452180775-5e8d5f1f1c0f?auto=format&fit=crop&w=800&q=85"),
                ("Dum Paneer",130,"https://images.unsplash.com/photo-1631452180519-c014fe946bc7?auto=format&fit=crop&w=800&q=85"),
                ("Corn Palak",110,"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85"),
                ("Aloo Matar",90,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Matar Mushroom",120,"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=85"),
                ("Lasooni Palak",110,"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=85")
              ]
              additions = ''.join(f'add(Product("{n}",{price},"Special Sabji","{url}"));' for n,price,url in items)
              marker = ' private val categories='
              if marker not in s:
                  raise SystemExit("categories marker not found")
              s = s.replace(marker, ' '+additions+'\n'+marker, 1)
              p.write_text(s, encoding="utf-8")
              print("Added 35 Special Sabji products")
          else:
              print("Special Sabji products already present")

      - name: Commit source changes back to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Add 35 Special Sabji products [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
