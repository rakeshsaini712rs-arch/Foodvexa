name: Build Foodvexa APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Restaurant Hotel and Zomato-style product badge fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s=p.read_text()

          # Keep the stable Rajasthan-only Restaurant/Hotel selector.
          start=s.find(' private fun restaurantHotelDialog(){')
          if start >= 0:
              end=s.find(' private fun showCart()', start)
              if end < 0:
                  raise SystemExit('showCart boundary not found')
              replacement=r''' private fun restaurantHotelDialog(){
              val districts=listOf("Ajmer","Alwar","Balotra","Banswara","Baran","Barmer","Beawar","Bharatpur","Bhilwara","Bikaner","Bundi","Chittorgarh","Churu","Dausa","Deeg","Didwana-Kuchaman","Dholpur","Dungarpur","Hanumangarh","Jaipur","Jaisalmer","Jalore","Jhalawar","Jhunjhunu","Jodhpur","Karauli","Khairthal-Tijara","Kota","Kotputli-Behror","Nagaur","Pali","Phalodi","Pratapgarh","Rajsamand","Salumbar","Sawai Madhopur","Sikar","Sirohi","Sri Ganganagar","Tonk","Udaipur")
              val cities=mapOf(
                "Jaipur" to listOf("Jaipur","Amer","Chomu","Sanganer"),
                "Jhunjhunu" to listOf("Jhunjhunu","Chirawa","Khetri","Nawalgarh","Pilani","Surajgarh"),
                "Sikar" to listOf("Sikar","Fatehpur","Lachhmangarh","Neem Ka Thana","Sri Madhopur","Danta Ramgarh"),
                "Jodhpur" to listOf("Jodhpur","Bilara","Bhopalgarh","Osian","Pipar City"),
                "Udaipur" to listOf("Udaipur","Gogunda","Jhadol","Kherwara","Rishabhdeo","Vallabhnagar"),
                "Ajmer" to listOf("Ajmer","Kishangarh","Beawar"),
                "Alwar" to listOf("Alwar","Bhiwadi","Rajgarh","Behror"),
                "Kota" to listOf("Kota","Itawa","Ramganj Mandi","Sangod","Sultanpur"),
                "Bikaner" to listOf("Bikaner","Nokha","Dungargarh","Kolayat"),
                "Churu" to listOf("Churu","Ratangarh","Sujangarh","Rajgarh","Taranagar"),
                "Barmer" to listOf("Barmer","Baytu","Gudamalani"),
                "Pali" to listOf("Pali","Jaitaran","Marwar Junction","Rohat","Sojat","Sumerpur"),
                "Tonk" to listOf("Tonk","Deoli","Malpura","Niwai","Uniara")
              )
              fun cityDialog(d:String){
                val list=cities[d].orEmpty().distinct().sorted()
                AlertDialog.Builder(this).setTitle("Select City • $d").setItems(list.toTypedArray()){_,city->
                  prefs.edit().putString("restaurant_state","Rajasthan").putString("restaurant_district",d).putString("restaurant_city",city).apply()
                  Toast.makeText(this,"Rajasthan → $d → $city selected",Toast.LENGTH_LONG).show()
                }.setNegativeButton("Back",null).show()
              }
              AlertDialog.Builder(this).setTitle("Select District • Rajasthan").setItems(districts.toTypedArray()){_,d->cityDialog(d)}.setNegativeButton("Cancel",null).show()
            }
          '''
              s=s[:start]+replacement+s[end:]

          # Add a continuously moving Zomato-style product highlight strip.
          helper='''\n private fun productBadgeTicker():TextView{\n    return TextView(this).apply{\n      text="🔥 Fresh & Hot     •     📍 Near & Fast     •     ⚡ Quick Delivery     •     🔥 Fresh & Hot"\n      textSize=11f\n      setTextColor(Color.rgb(255,196,70))\n      typeface=Typeface.DEFAULT_BOLD\n      gravity=Gravity.CENTER_VERTICAL\n      setPadding(dp(10),0,dp(10),0)\n      isSingleLine=true\n      ellipsize=android.text.TextUtils.TruncateAt.MARQUEE\n      marqueeRepeatLimit=-1\n      isSelected=true\n      setHorizontallyScrolling(true)\n      background=rounded(Color.rgb(57,40,29),12)\n    }\n }\n'''
          if 'private fun productBadgeTicker()' not in s:
              marker=' private fun renderProducts(){'
              if marker not in s: raise SystemExit('renderProducts marker not found')
              s=s.replace(marker,helper+marker,1)

          old='card.addView(label("• Available",12f,true,Color.rgb(50,205,120)),margin(0,4,0,0))'
          new='card.addView(productBadgeTicker(),margin(0,5,0,0))\n    card.addView(label("• Available",12f,true,Color.rgb(50,205,120)),margin(0,5,0,0))'
          if old in s:
              s=s.replace(old,new,1)
          elif 'card.addView(productBadgeTicker()' not in s:
              raise SystemExit('Available product line not found')
          p.write_text(s)
          PY
          rm -f app/src/main/res/drawable/restaurant_hotel_logo.svg

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
