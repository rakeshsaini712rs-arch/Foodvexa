name: Build Foodvexa APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 148 base and professional banner fix
        run: python3 banner_fix.py

      - name: Verify banners and categories
        run: |
          grep -Fq 'private fun bannerGrid():GridLayout' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'columnCount=2' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'rowCount=2' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'PIZZA • CHEESY & HOT' app/src/main/java/com/foodvexa/app/MainActivity.kt
          test "$(grep -o 'Category(\"Restaurant / Hotel\"' app/src/main/java/com/foodvexa/app/MainActivity.kt | wc -l)" -eq 1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
