name: Build Foodvexa APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Google Sign-In configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("app/google-services.json").read_text())
          package=data["client"][0]["client_info"]["android_client_info"]["package_name"]
          if package != "com.foodvexa.app":
              raise SystemExit("Wrong Android package: "+package)
          print("GOOGLE SIGN-IN CONFIG: package="+package)
          print("GOOGLE SIGN-IN CONFIG: google-services.json loaded")
          PY

      - name: Apply 148 base and Zomato-style banner carousel
        run: python3 banner_fix.py
      - name: Stabilize product images and remove duplicate category
        run: python3 image_stability_fix.py
      - name: Fix sticky banner/category and instant category selection
        run: python3 home_sticky_fix.py
      - name: Add instant category-to-product jump and preserve banners
        run: python3 navigation_fix.py
      - name: Compact premium home layout
        run: python3 compact_layout.py
      - name: Apply premium cart interface
        run: python3 premium_cart_fix.py
      - name: Final stability pass from video review
        run: python3 final_stability_fix.py
      - name: Apply Swiggy-style Foodvexa home layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s=p.read_text(encoding="utf-8")
          # Expand carousel card height without changing the banner's contents.
          if 'private fun bannerGrid():LinearLayout' in s:
              a=s.index('private fun bannerGrid():LinearLayout')
              b=s.find('private fun professionalBanner()',a)
              if b<0: b=s.find('private fun categoryCard(',a)
              if b<0: b=len(s)
              block=s[a:b]
              for old in ('dp(108)','dp(112)','dp(120)','dp(148)','dp(150)','dp(160)'):
                  block=block.replace(old,'dp(190)')
              s=s[:a]+block+s[b:]
          # Set category image height to a balanced, non-clipped size.
          needle='box.addView(image,LinearLayout.LayoutParams(-1,dp('
          i=s.find(needle)
          if i>=0:
              j=s.find(')))',i)
              if j>=0: s=s[:i]+needle+'66)))'+s[j+3:]
          # Product cards: update the first product image view height robustly.
          needle='card.addView(pic,LinearLayout.LayoutParams(-1,dp('
          i=s.find(needle)
          if i>=0:
              j=s.find(')))',i)
              if j>=0: s=s[:i]+needle+'104)))'+s[j+3:]
          # Three compact columns per row; all existing cart handlers stay attached.
          s=s.replace('index%2==0','index%3==0').replace('index%2==1','index%3==2')
          s=s.replace('row!!.addView(card,LinearLayout.LayoutParams(0,-2,1f).apply{leftMargin=if(index%2==0)0 else dp(5);rightMargin=if(index%2==0)dp(5) else 0})','row!!.addView(card,LinearLayout.LayoutParams(0,-2,1f).apply{leftMargin=if(index%3==0)0 else dp(3);rightMargin=if(index%3==2)0 else dp(3)})')
          s=s.replace('if(index%2==1 || index==filtered.lastIndex)content.addView(row,margin(0,0,0,10))','if(index%3==2 || index==filtered.lastIndex)content.addView(row,margin(0,0,0,10))')
          s=s.replace('label("• Available",10.5f,true,Color.rgb(50,205,120))','label("• Available",9f,true,Color.rgb(50,205,120))')
          s=s.replace('label("₹${p.price}",15f,true,Color.WHITE)','label("₹${p.price}",12f,true,Color.WHITE)')
          s=s.replace('add.setTextSize(12f)','add.setTextSize(10f)').replace('add.setPadding(dp(5),dp(4),dp(5),dp(4))','add.setPadding(dp(2),dp(3),dp(2),dp(3))')
          p.write_text(s,encoding="utf-8")
          checks={
            "three-column product rows":'if(index%3==0){row=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL}}' in s,
            "three-column row wrap":'if(index%3==2 || index==filtered.lastIndex)content.addView(row,margin(0,0,0,10))' in s,
            "product image height":'card.addView(pic,LinearLayout.LayoutParams(-1,dp(104)))' in s
          }
          for name,ok in checks.items(): print(("PASS " if ok else "FAIL ")+name)
          print("Home layout patch completed; continuing to compiler verification")
          PY

      - name: Enforce final payment/profile source state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s=p.read_text()
          selected='content.addView(label("Selected: "+prefs.getString("payment_method","COD"),15f,true,Color.rgb(76,210,145)),margin(0,0,0,16))'
          if "Selected: " not in s:
              marker="private fun showPaymentSettings()"
              pos=s.find(marker)
              if pos >= 0:
                  brace=s.find("{",pos)
                  if brace >= 0:
                      s=s[:brace+1]+"\n "+selected+s[brace+1:]
              else:
                  marker="private fun showProfile()"
                  pos=s.find(marker)
                  if pos < 0: raise SystemExit("No payment/profile method found")
                  brace=s.find("{",pos)
                  if brace < 0: raise SystemExit("Profile body not found")
                  s=s[:brace+1]+"\n "+selected+s[brace+1:]
          p.write_text(s)
          print("PAYMENT_SELECTED:", "Selected: " in s)
          PY

      - name: Compile hardening for final transformed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s=p.read_text()

          if "import org.json.JSONArray" not in s:
              s=s.replace("import org.json.JSONObject", "import org.json.JSONObject" + chr(10) + "import org.json.JSONArray", 1)

          # Some transformed bases collapse setupHomeBase() to a no-argument function.
          # Normalize that signature so setupBase(selectedNav) remains source-compatible.
          if "private fun setupHomeBase(selectedNav:Int=0)" not in s:
              s=s.replace("private fun setupHomeBase(){", "private fun setupHomeBase(selectedNav:Int=0){", 1)

          if "private fun setupBase(selectedNav:Int" not in s:
              marker="private fun setupHomeBase("
              pos=s.find(marker)
              if pos>=0:
                  helper="private fun setupBase(selectedNav:Int=0){setupHomeBase(selectedNav)}" + chr(10)
                  s=s[:pos]+helper+s[pos:]
              else:
                  raise SystemExit("setupHomeBase missing after transforms")

          if "private fun showHome()" not in s:
              marker="private fun setupHomeBase("
              pos=s.find(marker)
              if pos>=0:
                  helper='private fun showHome(){setupHomeBase();selectedCategory="All";query="";renderProducts()}' + chr(10)
                  s=s[:pos]+helper+s[pos:]
              else:
                  raise SystemExit("setupHomeBase missing after transforms")

          if "private fun categoryBackground(selected:Boolean)" not in s:
              marker="private fun categoryCard(c:Category)"
              pos=s.find(marker)
              if pos>=0:
                  helper='private fun categoryBackground(selected:Boolean)=GradientDrawable().apply{setColor(if(selected)orange else Color.WHITE);cornerRadius=dp(18).toFloat();setStroke(dp(1),if(selected)orange else Color.rgb(225,225,230))}' + chr(10)
                  s=s[:pos]+helper+s[pos:]
              else:
                  raise SystemExit("categoryCard missing after transforms")

          if "imageCache" not in s:
              cache_decl='private val imageCache=object:android.util.LruCache<String,android.graphics.Bitmap>(24){override fun sizeOf(key:String,value:android.graphics.Bitmap)=value.byteCount/1024}'
              marker="private fun loadImage"
              if marker in s:
                  s=s.replace(marker,cache_decl+chr(10)+marker,1)
              else:
                  e=s.rfind(chr(10)+"}")
                  if e>=0: s=s[:e]+chr(10)+cache_decl+s[e:]
                  else: raise SystemExit("MainActivity class end not found for image cache")

          p.write_text(s)
          print("COMPILE HARDENING: JSONArray import =", "import org.json.JSONArray" in s)
          print("COMPILE HARDENING: setupBase(Int) =", "private fun setupBase(selectedNav:Int" in s)
          print("COMPILE HARDENING: showHome =", "private fun showHome()" in s)
          print("COMPILE HARDENING: categoryBackground =", "private fun categoryBackground(selected:Boolean)" in s)
          print("COMPILE HARDENING: imageCache =", "imageCache" in s)
          PY
      - name: VERIFY exact final patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt").read_text()
          checks={
            "collection helper":"private fun toggleFavorite(p:Product)",
            "collection add":"Added to Collection",
            "collection remove":"Removed from Collection",
            "payment selected":"Selected: ",
            "profile tab":"setupBase(4)",
            "keyboard helper":"private fun hideKeyboard()",
            "Foodvexa branding":"Food ordering app by Foodvexa.",
            "order UI":"Your Order",
            "delivery details":"Delivery details",
            "location button":"Choose your current location",
            "buy button":"BUY NOW",
            "image cache":"imageCache",
          }
          missing=[k for k,v in checks.items() if v not in s]
          print("FINAL SOURCE CHECK:")
          for k,v in checks.items(): print(("PASS " if v in s else "FAIL ")+k)
          if s.count('Category("Restaurant / Hotel"') != 1:
              missing.append("exactly one Restaurant / Hotel category")
              print("FAIL exactly one Restaurant / Hotel category; count=",s.count('Category("Restaurant / Hotel"'))
          else: print("PASS exactly one Restaurant / Hotel category")
          if missing: raise SystemExit("Missing final patch: "+", ".join(missing))
          print("FINAL PATCH VERIFIED")
          PY
      - name: Prepare stable Foodvexa debug signing key
        run: |
          base64 -d app/foodvexa-debug.keystore.b64 > app/foodvexa-debug.keystore
          chmod 600 app/foodvexa-debug.keystore
          keytool -list -v -keystore app/foodvexa-debug.keystore -storepass foodvexa2026 -alias foodvexa | grep "SHA1:"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify built APK SHA-1 for Google Sign-In
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK"
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/foodvexa-certs.txt
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path("app/google-services.json").read_text())
          client=data["client"][0]
          hashes=[x.get("android_info",{}).get("certificate_hash","").replace(":","").lower() for x in client.get("oauth_client",[]) if x.get("client_type")==1]
          report=Path("/tmp/foodvexa-certs.txt").read_text()
          m=re.search(r"certificate SHA-1 digest:\s*([0-9A-Fa-f:]+)",report,re.I)
          if not m:
              print(report)
              raise SystemExit("Could not read SHA-1 from built APK")
          actual=m.group(1).replace(":","").lower()
          print("BUILT APK SHA-1:",m.group(1))
          print("REGISTERED ANDROID SHA-1:",", ".join(hashes))
          if actual not in hashes:
              raise SystemExit("BUILT APK SHA-1 is NOT registered in google-services.json")
          print("GOOGLE SIGN-IN VERIFIED: built APK SHA-1 is registered")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
