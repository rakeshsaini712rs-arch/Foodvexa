name: Build Foodvexa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Repair source and set Restaurant Hotel logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text()
          # Repair the known extra closing brace without touching other code.
          lines = s.splitlines(True)
          for i, line in enumerate(lines):
              if line.lstrip().startswith('private val products=mutableListOf<Product>().apply') and line.rstrip().endswith('}}'):
                  lines[i] = line.rstrip()[:-1] + '\n'
                  break
          s = ''.join(lines)
          # Use the new professional hotel/restaurant logo for the category.
          logo = 'https://raw.githubusercontent.com/rakeshsaini712rs-arch/Foodvexa/main/app/src/main/res/drawable/restaurant_hotel_logo.svg'
          patterns = [
              r'Category\(\s*"Restaurant/Hotel"\s*,\s*"[^"]*"\s*\)',
              r'Category\(\s*"Restaurant / Hotel"\s*,\s*"[^"]*"\s*\)',
          ]
          for pat in patterns:
              s, n = re.subn(pat, lambda m: m.group(0)[:m.group(0).find(',')] + ',"' + logo + '")', s, count=1)
          p.write_text(s)
          PY

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes"
          else
            git add app/src/main/java/com/foodvexa/app/MainActivity.kt
            git commit -m "Set professional Restaurant Hotel logo"
            git push
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
