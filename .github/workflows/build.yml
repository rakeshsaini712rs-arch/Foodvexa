name: Build Foodvexa APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Google Sign-In configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("app/google-services.json").read_text())
          package=data["client"][0]["client_info"]["android_client_info"]["package_name"]
          if package != "com.foodvexa.app":
              raise SystemExit("Wrong Android package: "+package)
          print("GOOGLE SIGN-IN CONFIG: package="+package)
          print("GOOGLE SIGN-IN CONFIG: google-services.json loaded")
          PY

      - name: Apply 148 base and Zomato-style banner carousel
        run: python3 banner_fix.py
      - name: Stabilize product images and remove duplicate category
        run: python3 image_stability_fix.py
      - name: Fix sticky banner/category and instant category selection
        run: python3 home_sticky_fix.py
      - name: Add instant category-to-product jump and preserve banners
        run: python3 navigation_fix.py
      - name: Compact premium home layout
        run: python3 compact_layout.py
      - name: Apply premium cart interface
        run: python3 premium_cart_fix.py
      - name: Final stability pass from video review
        run: python3 final_stability_fix.py
      - name: Match Zomato scroll behavior with sticky categories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s=p.read_text(encoding="utf-8")
          # Keep a second category strip ready to pin below the fixed search bar.
          if "private var stickyCategoryRow:LinearLayout?=null" not in s:
              s=s.replace("private var categoryRow:LinearLayout?=null",
                          "private var categoryRow:LinearLayout?=null;private var stickyCategoryRow:LinearLayout?=null;private var stickyCategoryStrip:LinearLayout?=null",1)
          start=s.index(" private fun showHome(){")
          end=s.index(" private fun locationHeader():LinearLayout",start)
          show=''' private fun showHome(){
           setupHomeBase()
           val header=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER_VERTICAL;setPadding(dp(8),0,dp(8),0)}
           val brand=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;gravity=Gravity.CENTER_VERTICAL}
           val name=label("FOODVEXA",23f,true,Color.WHITE)
           val styled=android.text.SpannableString("FOODVEXA")
           styled.setSpan(android.text.style.ForegroundColorSpan(Color.WHITE),0,4,android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
           styled.setSpan(android.text.style.ForegroundColorSpan(Color.rgb(255,196,0)),4,8,android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
           name.text=styled
           brand.addView(name);brand.addView(label("Taste the Happiness",11f,false,Color.LTGRAY))
           header.addView(brand,LinearLayout.LayoutParams(0,dp(54),1f))
           header.addView(label("♧",26f,false,Color.WHITE).apply{gravity=Gravity.CENTER},LinearLayout.LayoutParams(dp(40),dp(50)))
           val scroll=content.parent as ScrollView
           val shell=scroll.parent as LinearLayout
           val fixed=shell.getChildAt(0) as LinearLayout
           fixed.addView(header)
           fixed.addView(locationHeader(),margin(0,2,0,6))
           val search=EditText(this).apply{
            hint="Search food, sweets, fast food...";setHintTextColor(Color.LTGRAY);setTextColor(Color.WHITE)
            setSingleLine(true);inputType=InputType.TYPE_CLASS_TEXT;setPadding(dp(14),0,dp(14),0);background=rounded(Color.WHITE,16)
            addTextChangedListener(object:android.text.TextWatcher{
             override fun beforeTextChanged(s:CharSequence?,st:Int,c:Int,a:Int){}
             override fun onTextChanged(s:CharSequence?,st:Int,b:Int,c:Int){query=s?.toString().orEmpty();renderProducts()}
             override fun afterTextChanged(e:android.text.Editable?){}
            })
           }
           searchBox=search
           fixed.addView(search,margin(0,0,0,7))
           val sticky=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding(0,dp(2),0,dp(3));setBackgroundColor(Color.rgb(20,18,23));visibility=View.GONE}
           stickyCategoryStrip=sticky
           stickyCategoryRow=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL}
           categories.forEach{c->stickyCategoryRow!!.addView(categoryCard(c),LinearLayout.LayoutParams(dp(92),dp(78)).apply{rightMargin=dp(6)})}
           val stickyScroll=HorizontalScrollView(this).apply{isHorizontalScrollBarEnabled=false;overScrollMode=android.view.View.OVER_SCROLL_NEVER;addView(stickyCategoryRow)}
           sticky.addView(stickyScroll,LinearLayout.LayoutParams(-1,dp(82)))
           fixed.addView(sticky,LinearLayout.LayoutParams(-1,-2))
           content.addView(bannerGrid(),margin(0,0,0,3))
           content.addView(label("Categories",21f,true,Color.WHITE),margin(0,0,0,4))
           categoryRow=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL}
           categories.forEach{c->categoryRow!!.addView(categoryCard(c),LinearLayout.LayoutParams(dp(92),dp(78)).apply{rightMargin=dp(6)})}
           content.addView(HorizontalScrollView(this).apply{isHorizontalScrollBarEnabled=false;overScrollMode=android.view.View.OVER_SCROLL_NEVER;addView(categoryRow)},LinearLayout.LayoutParams(-1,dp(82)))
           content.addView(label(if(selectedCategory=="All")"Popular near you" else selectedCategory,21f,true,Color.WHITE),margin(0,2,0,5))
           renderProducts()
           scroll.setOnScrollChangeListener{_,_,scrollY,_,_->
            val row=categoryRow ?: return@setOnScrollChangeListener
            val loc=IntArray(2);row.getLocationOnScreen(loc)
            val fixedLoc=IntArray(2);fixed.getLocationOnScreen(fixedLoc)
            val threshold=fixedLoc[1]+fixed.height
            val shouldStick=loc[1] <= threshold
            val currentlyVisible=sticky.visibility==View.VISIBLE
            if(shouldStick!=currentlyVisible) sticky.visibility=if(shouldStick)View.VISIBLE else View.GONE
           }
          }
          '''
          s=s[:start]+show+s[end:]
          # Update both the scrolling category cards and pinned cards after selection.
          old='''private fun refreshCategorySelection(){categoryRow?.let{row->for(i in 0 until row.childCount){val box=row.getChildAt(i);val selected=categories.getOrNull(i)?.name==selectedCategory;box.background=categoryBackground(selected);if(box is LinearLayout && box.childCount>1){val tv=box.getChildAt(1);if(tv is TextView)tv.setTextColor(if(selected)Color.WHITE else ink)}}}}'''
          new='''private fun refreshCategorySelection(){listOfNotNull(categoryRow,stickyCategoryRow).forEach{row->for(i in 0 until row.childCount){val box=row.getChildAt(i);val selected=categories.getOrNull(i)?.name==selectedCategory;box.background=categoryBackground(selected);if(box is LinearLayout && box.childCount>1){val tv=box.getChildAt(1);if(tv is TextView)tv.setTextColor(if(selected)Color.WHITE else ink)}}}}'''
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          checks={
           "banner inside scroll content":'content.addView(bannerGrid(),margin(0,0,0,3))' in s,
           "category row inside scroll content":'content.addView(HorizontalScrollView(this).apply{isHorizontalScrollBarEnabled=false;overScrollMode=android.view.View.OVER_SCROLL_NEVER;addView(categoryRow)}' in s,
           "sticky strip below search":'fixed.addView(sticky,LinearLayout.LayoutParams(-1,-2))' in s,
           "scroll threshold listener":'val shouldStick=loc[1] <= threshold' in s,
           "both category rows refresh":'listOfNotNull(categoryRow,stickyCategoryRow)' in s
          }
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): raise SystemExit("Sticky category layout verification failed")
          PY

      - name: Ensure Android View import for sticky scrolling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s=p.read_text()
          if "import android.view.View" not in s:
              anchor="import android.view.Gravity"
              if anchor in s:
                  s=s.replace(anchor, anchor+"\\nimport android.view.View", 1)
              else:
                  s=s.replace("package com.foodvexa.app", "package com.foodvexa.app\\n\\nimport android.view.View", 1)
          p.write_text(s)
          assert "import android.view.View" in s, "android.view.View import still missing"
          print("PASS android.view.View import present")
          PY

      - name: Skip unsafe inline home layout rewrite
        run: echo "Keeping the verified MainActivity home layout; avoiding source rewrite that breaks Kotlin scope"

      - name: Enforce final payment/profile source state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s=p.read_text()
          selected='content.addView(label("Selected: "+prefs.getString("payment_method","COD"),15f,true,Color.rgb(76,210,145)),margin(0,0,0,16))'
          if "Selected: " not in s:
              marker="private fun showPaymentSettings()"
              pos=s.find(marker)
              if pos >= 0:
                  brace=s.find("{",pos)
                  if brace >= 0:
                      s=s[:brace+1]+"\n "+selected+s[brace+1:]
              else:
                  marker="private fun showProfile()"
                  pos=s.find(marker)
                  if pos < 0: raise SystemExit("No payment/profile method found")
                  brace=s.find("{",pos)
                  if brace < 0: raise SystemExit("Profile body not found")
                  s=s[:brace+1]+"\n "+selected+s[brace+1:]
          p.write_text(s)
          print("PAYMENT_SELECTED:", "Selected: " in s)
          PY

      - name: Compile hardening for final transformed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s=p.read_text()

          if "import org.json.JSONArray" not in s:
              s=s.replace("import org.json.JSONObject", "import org.json.JSONObject" + chr(10) + "import org.json.JSONArray", 1)

          # Some transformed bases collapse setupHomeBase() to a no-argument function.
          # Normalize that signature so setupBase(selectedNav) remains source-compatible.
          if "private fun setupHomeBase(selectedNav:Int=0)" not in s:
              s=s.replace("private fun setupHomeBase(){", "private fun setupHomeBase(selectedNav:Int=0){", 1)

          if "private fun setupBase(selectedNav:Int" not in s:
              marker="private fun setupHomeBase("
              pos=s.find(marker)
              if pos>=0:
                  helper="private fun setupBase(selectedNav:Int=0){setupHomeBase(selectedNav)}" + chr(10)
                  s=s[:pos]+helper+s[pos:]
              else:
                  raise SystemExit("setupHomeBase missing after transforms")

          if "private fun showHome()" not in s:
              marker="private fun setupHomeBase("
              pos=s.find(marker)
              if pos>=0:
                  helper='private fun showHome(){setupHomeBase();selectedCategory="All";query="";renderProducts()}' + chr(10)
                  s=s[:pos]+helper+s[pos:]
              else:
                  raise SystemExit("setupHomeBase missing after transforms")

          if "private fun categoryBackground(selected:Boolean)" not in s:
              marker="private fun categoryCard(c:Category)"
              pos=s.find(marker)
              if pos>=0:
                  helper='private fun categoryBackground(selected:Boolean)=GradientDrawable().apply{setColor(if(selected)orange else Color.WHITE);cornerRadius=dp(18).toFloat();setStroke(dp(1),if(selected)orange else Color.rgb(225,225,230))}' + chr(10)
                  s=s[:pos]+helper+s[pos:]
              else:
                  raise SystemExit("categoryCard missing after transforms")

          if "imageCache" not in s:
              cache_decl='private val imageCache=object:android.util.LruCache<String,android.graphics.Bitmap>(24){override fun sizeOf(key:String,value:android.graphics.Bitmap)=value.byteCount/1024}'
              marker="private fun loadImage"
              if marker in s:
                  s=s.replace(marker,cache_decl+chr(10)+marker,1)
              else:
                  e=s.rfind(chr(10)+"}")
                  if e>=0: s=s[:e]+chr(10)+cache_decl+s[e:]
                  else: raise SystemExit("MainActivity class end not found for image cache")

          p.write_text(s)
          print("COMPILE HARDENING: JSONArray import =", "import org.json.JSONArray" in s)
          print("COMPILE HARDENING: setupBase(Int) =", "private fun setupBase(selectedNav:Int" in s)
          print("COMPILE HARDENING: showHome =", "private fun showHome()" in s)
          print("COMPILE HARDENING: categoryBackground =", "private fun categoryBackground(selected:Boolean)" in s)
          print("COMPILE HARDENING: imageCache =", "imageCache" in s)
          PY
      - name: VERIFY exact final patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt").read_text()
          checks={
            "collection helper":"private fun toggleFavorite(p:Product)",
            "collection add":"Added to Collection",
            "collection remove":"Removed from Collection",
            "payment selected":"Selected: ",
            "profile tab":"setupBase(4)",
            "keyboard helper":"private fun hideKeyboard()",
            "Foodvexa branding":"Food ordering app by Foodvexa.",
            "order UI":"Your Order",
            "delivery details":"Delivery details",
            "location button":"Choose your current location",
            "buy button":"BUY NOW",
            "image cache":"imageCache",
          }
          missing=[k for k,v in checks.items() if v not in s]
          print("FINAL SOURCE CHECK:")
          for k,v in checks.items(): print(("PASS " if v in s else "FAIL ")+k)
          if s.count('Category("Restaurant / Hotel"') != 1:
              missing.append("exactly one Restaurant / Hotel category")
              print("FAIL exactly one Restaurant / Hotel category; count=",s.count('Category("Restaurant / Hotel"'))
          else: print("PASS exactly one Restaurant / Hotel category")
          if missing: raise SystemExit("Missing final patch: "+", ".join(missing))
          print("FINAL PATCH VERIFIED")
          PY
      - name: Prepare stable Foodvexa debug signing key
        run: |
          base64 -d app/foodvexa-debug.keystore.b64 > app/foodvexa-debug.keystore
          chmod 600 app/foodvexa-debug.keystore
          keytool -list -v -keystore app/foodvexa-debug.keystore -storepass foodvexa2026 -alias foodvexa | grep "SHA1:"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify built APK SHA-1 for Google Sign-In
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK"
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/foodvexa-certs.txt
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path("app/google-services.json").read_text())
          client=data["client"][0]
          hashes=[x.get("android_info",{}).get("certificate_hash","").replace(":","").lower() for x in client.get("oauth_client",[]) if x.get("client_type")==1]
          report=Path("/tmp/foodvexa-certs.txt").read_text()
          m=re.search(r"certificate SHA-1 digest:\s*([0-9A-Fa-f:]+)",report,re.I)
          if not m:
              print(report)
              raise SystemExit("Could not read SHA-1 from built APK")
          actual=m.group(1).replace(":","").lower()
          print("BUILT APK SHA-1:",m.group(1))
          print("REGISTERED ANDROID SHA-1:",", ".join(hashes))
          if actual not in hashes:
              raise SystemExit("BUILT APK SHA-1 is NOT registered in google-services.json")
          print("GOOGLE SIGN-IN VERIFIED: built APK SHA-1 is registered")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
