name: Build Foodvexa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply food image fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s = p.read_text(encoding="utf-8")

          # Fast Food category button: use a different dedicated pizza image.
          s = s.replace(
              'Category("Fast Food","https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=800&q=85")',
              'Category("Fast Food","https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=800&q=85")'
          )

          # Snacks: use dedicated real food images instead of unrelated images.
          s = s.replace(
              'https://images.unsplash.com/photo-1676700310660-e92d03e259c3?auto=format&fit=crop&fm=jpg&q=85&w=1200',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Kachori-1.jpg'
          )
          s = s.replace(
              'https://upload.wikimedia.org/wikipedia/commons/d/d5/Mirchi_Bada_Mirchi_bajji.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Mirchi_Bada_from_Jodhpur_1.jpg'
          )

          p.write_text(s, encoding="utf-8")
          print("Applied Fast Food/Pizza, Kachori and Mirchi Bada image fixes")

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
