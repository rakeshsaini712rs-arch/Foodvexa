name: Build Foodvexa APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply 148 base and Zomato-style banner carousel
        run: python3 banner_fix.py
      - name: Stabilize product images and remove duplicate category
        run: python3 image_stability_fix.py
      - name: Fix sticky banner/category and instant category selection
        run: python3 home_sticky_fix.py
      - name: Add instant category-to-product jump and preserve banners
        run: python3 navigation_fix.py
      - name: Compact premium home layout
        run: python3 compact_layout.py
      - name: Apply premium cart interface
        run: python3 premium_cart_fix.py
      - name: Final stability pass from video review
        run: python3 final_stability_fix.py
      - name: Force final payment/profile source state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s=p.read_text()
          def fix_method(name):
              global s
              m=re.search(r"private\s+fun\s+"+re.escape(name)+r"\s*\(\)\s*\{",s)
              if not m: return
              nxt=re.search(r"\nprivate\s+fun\s+",s[m.end():])
              end=m.end()+(nxt.start() if nxt else len(s[m.end():]))
              block=s[m.start():end]
              block=re.sub(r"\bsetupBase\(\)", "setupBase(4)", block, count=1)
              if name=="showPaymentSettings":
                  selected='content.addView(label("Selected: "+prefs.getString("payment_method","COD"),15f,true,Color.rgb(76,210,145)),margin(0,0,0,16))'
                  block=re.sub(r'content\.addView\(label\("Choose your preferred payment method".*?\)\)', selected, block, count=1)
                  if "Selected: " not in block:
                      pos=block.find("setupBase(4)")
                      if pos>=0:
                          line_end=block.find("\n",pos)
                          if line_end<0: line_end=pos+len("setupBase(4)")
                          block=block[:line_end+1]+" "+selected+"\n"+block[line_end+1:]
              s=s[:m.start()]+block+s[end:]
          for name in ("showAddressBook","showPaymentSettings","showProfile"):
              fix_method(name)
          p.write_text(s)
          print("FORCED payment/profile source state")
          PY
      - name: Normalize final payment source check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          s=p.read_text()
          selected='content.addView(label("Selected: "+prefs.getString("payment_method","COD"),15f,true,Color.rgb(76,210,145)),margin(0,0,0,16))'
          m=re.search(r'private\s+fun\s+showPaymentSettings\(\)\s*\{',s)
          if not m:
              raise SystemExit("showPaymentSettings method not found")
          nxt=re.search(r'\nprivate\s+fun\s+',s[m.end():])
          end=m.end()+(nxt.start() if nxt else len(s[m.end():]))
          block=s[m.start():end]
          if "Selected: " not in block:
              pos=block.find("setupBase(4)")
              if pos < 0:
                  block=block[:]+ "\n setupBase(4)\n " + selected + "\n"
              else:
                  line_end=block.find("\n",pos)
                  if line_end < 0: line_end=len(block)
                  block=block[:line_end+1]+" "+selected+"\n"+block[line_end+1:]
              s=s[:m.start()]+block+s[end:]
          p.write_text(s)
          print("Selected payment source:", "Selected: " in s)
          PY

      - name: VERIFY exact final patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("app/src/main/java/com/foodvexa/app/MainActivity.kt").read_text()
          checks={
            "collection helper":"private fun toggleFavorite(p:Product)",
            "collection add":"Added to Collection",
            "collection remove":"Removed from Collection",
            "payment selected":"Selected: ",
            "profile tab":"setupBase(4)",
            "keyboard helper":"private fun hideKeyboard()",
            "Foodvexa branding":"Food ordering app by Foodvexa.",
            "order UI":"Your Order",
            "delivery details":"Delivery details",
            "location button":"Choose your current location",
            "buy button":"BUY NOW",
            "image cache":"imageCache",
          }
          missing=[k for k,v in checks.items() if v not in s]
          print("FINAL SOURCE CHECK:")
          for k,v in checks.items(): print(("PASS " if v in s else "FAIL ")+k)
          if s.count('Category("Restaurant / Hotel"') != 1:
              missing.append("exactly one Restaurant / Hotel category")
              print("FAIL exactly one Restaurant / Hotel category; count=",s.count('Category("Restaurant / Hotel"'))
          else: print("PASS exactly one Restaurant / Hotel category")
          if missing: raise SystemExit("Missing final patch: "+", ".join(missing))
          print("FINAL PATCH VERIFIED")
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Print exact debug SHA-1 for Firebase
        run: |
          echo "=== FOODVEXA DEBUG SHA-1 ==="
          keytool -list -v -alias androiddebugkey -keystore ~/.android/debug.keystore -storepass android -keypass android | grep -E "SHA1:|SHA-1:"
          echo "============================="
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
