name: Build Foodvexa APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 148 base and Zomato-style banner carousel
        run: python3 banner_fix.py

      - name: Stabilize product images and remove duplicate category
        run: python3 image_stability_fix.py

      - name: Fix sticky banner/category and instant category selection
        run: python3 home_sticky_fix.py

      - name: Add instant category-to-product jump and preserve banners
        run: python3 navigation_fix.py

      - name: Compact premium home layout
        run: python3 compact_layout.py

      - name: Apply premium cart interface
        run: python3 premium_cart_fix.py

      - name: Verify required UI patches
        run: |
          grep -Fq 'Your Order' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'Delivery details' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'Choose your current location' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'Buy Now' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'private fun showCart()' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'private fun bannerGrid():LinearLayout' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'HorizontalScrollView' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'imageCache' app/src/main/java/com/foodvexa/app/MainActivity.kt
          test "$(grep -o 'Category(\"Restaurant / Hotel\"' app/src/main/java/com/foodvexa/app/MainActivity.kt | wc -l)" -eq 1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
