name: Build Foodvexa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Repair source and add Rajasthan-only Restaurant/Hotel selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text()
          lines = s.splitlines(True)
          for i, line in enumerate(lines):
              if line.lstrip().startswith('private val products=mutableListOf<Product>().apply') and line.rstrip().endswith('}}'):
                  lines[i] = line.rstrip()[:-1] + '\n'
                  break
          s = ''.join(lines)
          old = 'if(selectedCategory!=c.name){selectedCategory=c.name;renderProducts()}'
          new = 'if(c.name=="Restaurant / Hotel"){restaurantHotelDialog()}else if(selectedCategory!=c.name){selectedCategory=c.name;renderProducts()}'
          s = s.replace(old, new, 1)
          marker = ' private fun showCart(){'
          fn = ''' private fun restaurantHotelDialog(){\n  AlertDialog.Builder(this).setTitle("Select State").setItems(arrayOf("Rajasthan")){_,_->\n   Toast.makeText(this,"Rajasthan selected",Toast.LENGTH_SHORT).show()\n  }.setNegativeButton("Cancel",null).show()\n }\n'''
          if 'private fun restaurantHotelDialog()' not in s:
              s = s.replace(marker, fn + marker, 1)
          p.write_text(s)
          PY

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes"
          else
            git add app/src/main/java/com/foodvexa/app/MainActivity.kt
            git commit -m "Fix Kotlin scope and Rajasthan restaurant selector"
            git push
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
