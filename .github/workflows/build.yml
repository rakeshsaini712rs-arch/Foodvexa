name: Build Foodvexa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Repair misplaced Special Sabji products
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/foodvexa/app/MainActivity.kt")
          lines = p.read_text(encoding="utf-8").splitlines()
          bad = []
          kept = []
          for line in lines:
              if line.lstrip().startswith('add(Product("Shahi Paneer",120,"Special Sabji"'):
                  bad.append(line.strip())
              else:
                  kept.append(line)
          if bad:
              additions = ''.join(bad)
              marker = 'names.forEachIndexed{i,n->add(Product(n,prices[i],"Fast Food",pizzaImages[i]))}}'
              text = '\n'.join(kept)
              if marker not in text:
                  raise SystemExit("product list marker not found")
              text = text.replace(marker, marker[:-2] + additions + '}}', 1)
              p.write_text(text + '\n', encoding="utf-8")
              print("Repaired misplaced Special Sabji products")
          else:
              print("No misplaced Special Sabji line found")

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
          else
            git commit -m "Repair Special Sabji product placement [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
