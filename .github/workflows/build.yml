name: Build Foodvexa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply product image fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text()

          # Keep the base product data as the source of truth. Do not use random
          # loremflickr images, because they can show a different dish than the name.
          old = 'return "https://loremflickr.com/800/600/$tag/all?lock=$lock"'
          new = '''return when(n){
   "samosa"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Samosa.jpg"
   "kachori"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Kachori-1.jpg"
   "mirchi bada"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Mirchi_Bada_from_Jodhpur_1.jpg"
   "shahi paneer"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Shahi_paneer.jpg"
   "kadai paneer"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Kadai_paneer.jpg"
   "paneer butter masala"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Paneer_Butter_Masala.jpg"
   "matar paneer"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Matar_Paneer.JPG"
   "palak paneer"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Palak_paneer.JPG"
   "malai kofta"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Malai_Kofta.jpg"
   "rajbhog"->"https://commons.wikimedia.org/wiki/Special:Redirect/file/Rajbhog.jpg"
   else->p.imageUrl
  }'''
          if old not in s:
              raise SystemExit('random product image resolver not found')
          s = s.replace(old, new, 1)

          # Remove duplicate Restaurant / Hotel entries and enforce unique category names.
          token = 'Category("Restaurant / Hotel","local://restaurant_hotel_logo")'
          first = s.find(token)
          if first >= 0:
              second = s.find(token, first + len(token))
              while second >= 0:
                  s = s[:second] + s[second + len(token):]
                  second = s.find(token, second)

          m = re.search(r'private val categories=listOf\(.*?\)\n private val cart', s, re.S)
          if not m:
              raise SystemExit('categories declaration not found')
          block = m.group(0)
          if '.distinctBy { it.name }' not in block:
              block = block.replace('\n private val cart', '.distinctBy { it.name }\n private val cart')
              s = s[:m.start()] + block + s[m.end():]

          # Keep the Zomato-style moving ticker and availability line.
          old = 'card.addView(label("• Available",12f,true,Color.rgb(50,205,120)),margin(0,4,0,0))'
          new = '''val ticker=TextView(this).apply{ text="🔥 Fresh & Hot    •    📍 Near & Fast    •    ⚡ Quick Delivery    •    🔥 Fresh & Hot"; textSize=10.5f; setTextColor(Color.rgb(255,196,70)); typeface=Typeface.DEFAULT_BOLD; gravity=Gravity.CENTER_VERTICAL; isSingleLine=true; ellipsize=android.text.TextUtils.TruncateAt.MARQUEE; marqueeRepeatLimit=-1; isSelected=true; setHorizontallyScrolling(true); setPadding(dp(4),0,dp(4),0) }
          card.addView(ticker,margin(0,4,0,0))
          card.addView(label("• Available",12f,true,Color.rgb(50,205,120)),margin(0,3,0,0))'''
          if old not in s:
              raise SystemExit('product availability line not found')
          s = s.replace(old, new, 1)

          s = s.replace('setPadding(dp(16),dp(12),dp(16),dp(112))', 'setPadding(dp(16),dp(12),dp(16),dp(132))', 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
