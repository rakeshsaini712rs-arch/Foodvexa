name: Deploy Foodvexa Storage Rules

on:
  push:
    branches: [main]
    paths:
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/deploy-storage-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-storage-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Firebase service account and project
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT secret."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(s.project_id !== 'foodvexa-2daca') { console.error('Wrong Firebase project; refusing to deploy.'); process.exit(2); }" "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Storage rules only
        run: firebase deploy --only storage --project foodvexa-2daca --non-interactive
