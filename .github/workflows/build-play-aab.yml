name: Build Foodvexa Play Store AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Foodvexa upload signing key
        run: |
          set -e
          base64 -d app/foodvexa-debug.keystore.b64 > app/foodvexa-debug.keystore
          chmod 600 app/foodvexa-debug.keystore
          keytool -list -keystore app/foodvexa-debug.keystore -storepass foodvexa2026 -alias foodvexa

      - name: Build Play Store release app bundle
        run: gradle :app:bundleRelease --no-daemon

      - name: Verify AAB output
        run: |
          set -e
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          ls -lh "$AAB"
          jarsigner -verify "$AAB"

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Play-Store-AAB-v2.3
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
