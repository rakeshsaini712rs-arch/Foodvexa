name: Build Foodvexa Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 148 base and Zomato-style banner carousel
        run: python3 banner_fix.py

      - name: Stabilize product images and remove duplicate category
        run: python3 image_stability_fix.py

      - name: Fix sticky banner/category and instant category selection
        run: python3 home_sticky_fix.py

      - name: Verify banners categories images and navigation stability
        run: |
          grep -Fq 'private fun bannerGrid():LinearLayout' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'HorizontalScrollView' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'auto.postDelayed(runner,4500)' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'PIZZA • CHEESY & HOT' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'imageCache' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'view.getTag()==url' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'correctedImageUrl(p)' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'private fun setupHomeBase()' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'private var categoryRow:LinearLayout?=null' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'refreshCategorySelection()' app/src/main/java/com/foodvexa/app/MainActivity.kt
          test "$(grep -o 'Category(\"Restaurant / Hotel\"' app/src/main/java/com/foodvexa/app/MainActivity.kt | wc -l)" -eq 1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
