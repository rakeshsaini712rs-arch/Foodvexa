name: Build Foodvexa Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fix product photo mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text()

          # Keep the first Restaurant / Hotel category and remove later duplicates.
          token = 'Category("Restaurant / Hotel","local://restaurant_hotel_logo")'
          first = s.find(token)
          if first >= 0:
              tail = s[first + len(token):]
              tail = tail.replace(',' + token, '')
              s = s[:first + len(token)] + tail

          pattern = r'private fun correctedImageUrl\(p:Product\):String\{.*?\n private fun renderProducts'
          replacement = '''private fun correctedImageUrl(p:Product):String{\n  // Every product already has an explicit image assigned in the product list.\n  // Do not replace it with a generic/random image.\n  return p.imageUrl\n }\n private fun renderProducts'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('correctedImageUrl function not found')
          s = s2

          # Ensure category names are unique at the source level too.
          marker = 'private val cart='
          if '.distinctBy { it.name }' not in s:
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('cart declaration not found')
              # categories is a list expression immediately before cart; close it with distinctBy.
              before = s[:pos]
              if before.rstrip().endswith('))'):
                  s = before.rstrip()[:-1] + '.distinctBy { it.name })' + s[pos:]

          p.write_text(s)
          PY

      - name: Validate source
        run: |
          grep -q 'return p.imageUrl' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'restaurant_hotel_logo' app/src/main/java/com/foodvexa/app/MainActivity.kt
          test -f app/src/main/res/drawable/restaurant_hotel_logo.xml

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
