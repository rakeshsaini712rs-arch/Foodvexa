name: Build Foodvexa Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the same debug signing key used by the verified APK workflow
        run: |
          set -e
          test -s app/foodvexa-debug.keystore.b64
          base64 -d app/foodvexa-debug.keystore.b64 > app/foodvexa-debug.keystore
          test -s app/foodvexa-debug.keystore
          chmod 600 app/foodvexa-debug.keystore
          keytool -list -keystore app/foodvexa-debug.keystore -storepass foodvexa2026 -alias foodvexa

      - name: Verify profile menu actions exist in the checked-out source
        run: |
          set -e
          FILE=app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'item("👤  My Profile"' "$FILE"
          grep -Fq 'item("❤️  Collection"' "$FILE"
          grep -Fq 'item("💳  Payment Settings"' "$FILE"
          grep -Fq 'item("📞  Call Support"' "$FILE"
          grep -Fq 'item("⭐  Feedback"' "$FILE"
          grep -Fq 'item("ℹ️  About"' "$FILE"
          echo "All six profile menu actions are present in the source being built."

      - name: Build APK from the checked-in source without destructive rewrite scripts
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload Foodvexa Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
