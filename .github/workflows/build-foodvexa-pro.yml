name: Build Foodvexa Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore product freshness line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='card.addView(label("• Available",12f,true,Color.rgb(50,205,120)),margin(0,4,0,0))'
          new='card.addView(label("🔥 Fresh & Hot  •  Near & Fast",12f,true,Color.rgb(50,205,120)),margin(0,4,0,0))'
          if old in s:
              s=s.replace(old,new)
          elif '🔥 Fresh & Hot  •  Near & Fast' not in s:
              raise SystemExit('Product card target line not found')
          p.write_text(s,encoding='utf-8')
          print('Restored: 🔥 Fresh & Hot  •  Near & Fast')
          PY

      - name: Verify product freshness line
        run: |
          grep -Fq '🔥 Fresh & Hot  •  Near & Fast' app/src/main/java/com/foodvexa/app/MainActivity.kt

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
