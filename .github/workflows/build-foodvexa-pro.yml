name: Build Foodvexa Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply real premium home-screen layout
        run: python3 premium_layout_fix.py

      - name: Verify premium layout source
        run: |
          grep -Fq 'homeScroll=ScrollView(this)' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'jumpToProducts=true' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'dp(96)' app/src/main/java/com/foodvexa/app/MainActivity.kt
          test "$(grep -o 'Category(\"Restaurant / Hotel\"' app/src/main/java/com/foodvexa/app/MainActivity.kt | wc -l)" -eq 1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
