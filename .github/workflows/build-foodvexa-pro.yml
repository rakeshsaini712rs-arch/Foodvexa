name: Build Foodvexa Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fix Add to Cart layout before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='''        val add=primaryButton("Add to Cart"){addToCart(p);renderProducts()}\n        add.setTextSize(13f)\n        bottom.addView(add,LinearLayout.LayoutParams(dp(96),dp(44)))'''
          new='''        val add=primaryButton("Add to Cart"){addToCart(p);renderProducts()}\n        add.setTextSize(12f)\n        add.maxLines=2\n        add.ellipsize=null\n        add.minWidth=0\n        add.setPadding(dp(5),dp(4),dp(5),dp(4))\n        bottom.addView(add,LinearLayout.LayoutParams(0,dp(44),1.08f))'''
          if old not in s: raise SystemExit('Add to Cart target block not found')
          s=s.replace(old,new,1)
          old2='''bottom.addView(label("₹${p.price}",18f,true,Color.WHITE),LinearLayout.LayoutParams(0,dp(44),1f))'''
          new2='''bottom.addView(label("₹${p.price}",18f,true,Color.WHITE),LinearLayout.LayoutParams(0,dp(44),0.92f))'''
          if old2 not in s: raise SystemExit('price target block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Bundle product images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          source = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          text = source.read_text(encoding='utf-8')
          urls = sorted(set(re.findall(r'https://[^"\\]+', text)))
          assets = Path('app/src/main/assets')
          assets.mkdir(parents=True, exist_ok=True)

          downloaded = 0
          for url in urls:
              name = 'product_' + hashlib.sha256(url.encode()).hexdigest()[:16] + '.img'
              target = assets / name
              if not target.exists() or target.stat().st_size < 1000:
                  result = subprocess.run([
                      'curl', '-L', '--fail', '--silent', '--show-error',
                      '--max-time', '30', '-A', 'Foodvexa/1.0', url,
                      '-o', str(target)
                  ], capture_output=True, text=True)
                  if result.returncode != 0 or not target.exists() or target.stat().st_size < 1000:
                      target.unlink(missing_ok=True)
                      continue
              text = text.replace(url, 'asset://' + name)
              downloaded += 1

          source.write_text(text, encoding='utf-8')
          print(f'Bundled {downloaded} product images')
          PY

      - name: Validate product images
        shell: bash
        run: |
          test -d app/src/main/assets
          test -n "$(find app/src/main/assets -type f -name 'product_*' -size +1k | head -1)"
          grep -q 'asset://product_' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'assets.open' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'Add to Cart' app/src/main/java/com/foodvexa/app/MainActivity.kt

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
