name: Build Foodvexa Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply premium cart screen directly to current MainActivity
        run: python3 premium_cart_fix.py

      - name: Apply final stability pass
        run: python3 final_stability_fix.py

      - name: Verify cart screen
        run: |
          grep -Fq 'private fun showCart(){' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'Your Order' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'Delivery details' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Eq 'Choose your current location|Choose delivery location' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'BUY NOW' app/src/main/java/com/foodvexa/app/MainActivity.kt

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Print actual debug SHA-1 for Firebase
        run: |
          echo "=== Foodvexa debug signing certificate ==="
          keytool -list -v -alias androiddebugkey -keystore ~/.android/debug.keystore -storepass android -keypass android | grep -E 'Alias name:|SHA1:|SHA-1:'
          echo "=== Gradle signing report ==="
          gradle :app:signingReport --no-daemon | grep -E 'Variant: debug|SHA1:|SHA-1:' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
