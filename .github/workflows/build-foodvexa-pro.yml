name: Build Foodvexa Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 148 base with 4-banner grid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          z = Path('Foodvexa-148-4-banner-grid.zip')
          if not z.exists():
              raise SystemExit('Foodvexa-148-4-banner-grid.zip not found')
          target = 'Foodvexa-main/app/src/main/java/com/foodvexa/app/MainActivity.kt'
          with ZipFile(z) as archive:
              data = archive.read(target)
          out = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          out.write_bytes(data)
          text = data.decode('utf-8')
          if 'private fun bannerGrid():GridLayout' not in text:
              raise SystemExit('4-banner grid code was not found in the 148 base source')
          if 'content.addView(bannerGrid()' not in text:
              raise SystemExit('4-banner grid is not attached to the home screen')
          print('148 base applied: 4-banner automatic 2x2 grid')
          PY

      - name: Verify 4-banner grid
        run: |
          grep -Fq 'private fun bannerGrid():GridLayout' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'content.addView(bannerGrid()' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'columnCount=2' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'rowCount=2' app/src/main/java/com/foodvexa/app/MainActivity.kt

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
