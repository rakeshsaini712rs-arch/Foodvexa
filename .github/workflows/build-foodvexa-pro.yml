name: Build Foodvexa Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final Foodvexa home layout
        run: python3 final_layout_fix.py

      - name: Verify final home layout
        run: |
          grep -Fq 'private var homeProductScroll:ScrollView?=null' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'homeProductScroll=scroll' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'LinearLayout.LayoutParams(dp(96),dp(94))' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'LinearLayout.LayoutParams(-1,dp(104))' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'LinearLayout.LayoutParams(dp(104),dp(104))' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'selectedCategory=c.name;showHome()' app/src/main/java/com/foodvexa/app/MainActivity.kt
          test "$(grep -o 'Category(\"Restaurant / Hotel\"' app/src/main/java/com/foodvexa/app/MainActivity.kt | wc -l)" -eq 1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
