name: Build Foodvexa Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final Foodvexa home layout
        run: python3 final_layout_fix.py

      - name: Apply premium cart screen
        run: python3 cart_screen_fix.py

      - name: Verify cart screen
        run: |
          grep -Fq 'private fun showCart(){' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'Your Order' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'Delivery details' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'Choose your current location' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -Fq 'Buy Now' app/src/main/java/com/foodvexa/app/MainActivity.kt

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
