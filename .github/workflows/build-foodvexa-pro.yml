name: Build Foodvexa Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply final product image and UI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s=p.read_text()

          # Use each product's explicit URL; never fall back to a random image service.
          s=s.replace('loadImage(pic,correctedImageUrl(p))','loadImage(pic,p.imageUrl)')
          s=s.replace('loadImage(image,correctedImageUrl(p))','loadImage(image,p.imageUrl)')

          old_loader='private fun loadImage(view:ImageView,url:String){imageExecutor.execute{try{val con=URL(url).openConnection() as HttpURLConnection;con.connectTimeout=7000;con.readTimeout=7000;con.connect();val bmp=BitmapFactory.decodeStream(con.inputStream);con.disconnect();if(bmp!=null)mainHandler.post{if(!isFinishing)view.setImageBitmap(bmp)}}catch(_:Exception){}}}'
          new_loader='''private fun loadImage(view:ImageView,url:String){
          imageExecutor.execute{
           var con:HttpURLConnection?=null
           try{
            con=URL(url).openConnection() as HttpURLConnection
            con.instanceFollowRedirects=true
            con.connectTimeout=15000
            con.readTimeout=15000
            con.setRequestProperty("User-Agent","Foodvexa/1.0 Android")
            con.setRequestProperty("Accept","image/avif,image/webp,image/jpeg,image/png,*/*")
            con.connect()
            if(con.responseCode in 200..399){
             con.inputStream.use{stream->
              val bmp=BitmapFactory.decodeStream(stream)
              if(bmp!=null)mainHandler.post{if(!isFinishing)view.setImageBitmap(bmp)}
             }
            }
           }catch(_:Exception){}
           finally{con?.disconnect()}
          }
         }'''
          if old_loader in s:s=s.replace(old_loader,new_loader,1)

          # Keep only one Restaurant / Hotel category and enforce unique category names.
          token='Category("Restaurant / Hotel","local://restaurant_hotel_logo")'
          first=s.find(token)
          if first>=0:
              second=s.find(token,first+len(token))
              while second>=0:
                  s=s[:second]+s[second+len(token):]
                  second=s.find(token,second)
          m=re.search(r'private val categories=listOf\(.*?\)\n private val cart',s,re.S)
          if not m:raise SystemExit('categories declaration not found')
          block=m.group(0)
          if '.distinctBy { it.name }' not in block:
              block=block.replace('\n private val cart','.distinctBy { it.name }\n private val cart')
              s=s[:m.start()]+block+s[m.end():]

          old_bad='card.addView(label("• Available",12f,true,Color.rgb(50,205,120)),margin(0,4,0,0))'
          ticker='''val ticker=TextView(this).apply{ text="🔥 Fresh & Hot    •    📍 Near & Fast    •    ⚡ Quick Delivery    •    🔥 Fresh & Hot"; textSize=10.5f; setTextColor(Color.rgb(255,196,70)); typeface=Typeface.DEFAULT_BOLD; gravity=Gravity.CENTER_VERTICAL; isSingleLine=true; ellipsize=android.text.TextUtils.TruncateAt.MARQUEE; marqueeRepeatLimit=-1; isSelected=true; setHorizontallyScrolling(true); setPadding(dp(4),0,dp(4),0) }
          card.addView(ticker,margin(0,4,0,0))
          card.addView(label("• Available",12f,true,Color.rgb(50,205,120)),margin(0,3,0,0))'''
          if old_bad in s:s=s.replace(old_bad,ticker,1)
          s=s.replace('setPadding(dp(16),dp(12),dp(16),dp(112))','setPadding(dp(16),dp(12),dp(16),dp(132))',1)
          p.write_text(s)
          PY

      - name: Validate final UI and images
        shell: bash
        run: |
          grep -q 'loadImage(pic,p.imageUrl)' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'loadImage(image,p.imageUrl)' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'User-Agent' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'Fresh & Hot' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'Near & Fast' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'Add to Cart' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'Available' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'restaurant_hotel_logo' app/src/main/java/com/foodvexa/app/MainActivity.kt
          test -f app/src/main/res/drawable/restaurant_hotel_logo.xml

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
