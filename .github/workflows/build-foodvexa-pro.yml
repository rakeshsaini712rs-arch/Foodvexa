name: Build Foodvexa Pro APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Patch MainActivity for Restaurant Hotel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s=p.read_text()
          # Repair the known product-list syntax without changing products.
          s=s.replace('pizzaImages[i]))add(Product("Shahi Paneer"','pizzaImages[i]));};add(Product("Shahi Paneer"',1)
          # Add the category once. This is deliberately a simple textual insertion because this file is minified.
          if 'Category("Restaurant/Hotel"' not in s:
              key='private val categories='
              pos=s.find(key)
              if pos<0: raise SystemExit('categories declaration not found')
              open_pos=s.find('(',pos)
              if open_pos<0: raise SystemExit('categories list opening not found')
              s=s[:open_pos+1]+'Category("Restaurant/Hotel","__RESTAURANT_HOTEL__"),'+s[open_pos+1:]
          # Make only the Restaurant/Hotel card open the selector.
          if 'showRestaurantHotelFlow(prefs)' not in s:
              old='selectedCategory=c.name;renderProducts()'
              if old not in s:
                  old='selectedCategory = c.name;renderProducts()'
              if old not in s: raise SystemExit('category click statement not found')
              new='if(c.name=="Restaurant/Hotel"){showRestaurantHotelFlow(prefs){showHome()}}else{selectedCategory=c.name;renderProducts()}'
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate selector wiring
        shell: bash
        run: |
          grep -q 'Category("Restaurant/Hotel"' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'showRestaurantHotelFlow(prefs)' app/src/main/java/com/foodvexa/app/MainActivity.kt
          test -f app/src/main/java/com/foodvexa/app/RestaurantHotelFlow.kt
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt app/src/main/java/com/foodvexa/app/RestaurantHotelFlow.kt
          if git diff --cached --quiet; then echo 'No source changes'; else git commit -m 'Wire Restaurant Hotel Rajasthan selector'; git push; fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
