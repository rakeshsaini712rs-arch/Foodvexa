name: Build Foodvexa Pro APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Repair Restaurant Hotel selector safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text()
          # Replace the previously injected malformed selector function as one block.
          replacement = '''private fun restaurantHotelDialog(){
          showRestaurantHotelFlow(prefs){ showHome() }
          }
          '''
          pattern = r'private fun restaurantHotelDialog\(\)\{.*?\n\s*private fun showCart\(\)'
          if re.search(pattern, s, flags=re.S):
              s = re.sub(pattern, replacement + 'private fun showCart()', s, count=1, flags=re.S)
          elif 'private fun restaurantHotelDialog()' not in s:
              marker = 'private fun showCart()'
              if marker in s:
                  s = s.replace(marker, replacement + marker, 1)
          # Repair the old product-list typo only if it still exists.
          s = s.replace('pizzaImages[i]))add(Product("Shahi Paneer"','pizzaImages[i]));};add(Product("Shahi Paneer"',1)
          p.write_text(s)
          PY
      - name: Validate selector wiring
        shell: bash
        run: |
          grep -q 'Category("Restaurant/Hotel"' app/src/main/java/com/foodvexa/app/MainActivity.kt
          grep -q 'showRestaurantHotelFlow(prefs)' app/src/main/java/com/foodvexa/app/MainActivity.kt
          test -f app/src/main/java/com/foodvexa/app/RestaurantHotelFlow.kt
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then echo 'No source changes'; else git commit -m 'Fix Restaurant Hotel selector Kotlin syntax'; git push; fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
