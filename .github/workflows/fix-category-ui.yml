name: Fix category UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply category UI patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch category UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          original = s

          # Keep Restaurant / Hotel only once in the category rail.
          s, n1 = re.subn(
              r',Category\("Restaurant / Hotel","local://restaurant_hotel_logo"\)\)\n private val cart=',
              ')\n private val cart=',
              s,
              count=1,
          )

          # Rebuild the home screen after selecting a category so the selected
          # card and product heading cannot get out of sync.
          old = 'setOnClickListener{if(c.name=="Restaurant / Hotel"){restaurantHotelDialog()}else if(c.name=="Restaurant / Hotel"){restaurantHotelDialog()}else if(selectedCategory!=c.name){if(c.name=="Restaurant/Hotel"){showRestaurantHotelFlow(prefs){showHome()}}else{selectedCategory=c.name;renderProducts()}}}}'
          new = 'setOnClickListener{if(c.name=="Restaurant / Hotel"||c.name=="Restaurant/Hotel"){restaurantHotelDialog()}else if(selectedCategory!=c.name){selectedCategory=c.name;showHome()}}'
          n2 = s.count(old)
          s = s.replace(old, new, 1)

          # Always start the category rail at the left edge after rebuilding.
          old_h = 'content.addView(HorizontalScrollView(this).apply{isHorizontalScrollBarEnabled=false;addView(row)})'
          new_h = 'content.addView(HorizontalScrollView(this).apply{isHorizontalScrollBarEnabled=false;overScrollMode=HorizontalScrollView.OVER_SCROLL_NEVER;addView(row);post{scrollTo(0,0)}})'
          n3 = s.count(old_h)
          s = s.replace(old_h, new_h, 1)

          if s == original:
              raise SystemExit('No category UI changes were applied')
          if n1 != 1 or n2 != 1 or n3 != 1:
              raise SystemExit(f'Unexpected match counts: duplicate={n1}, click={n2}, scroll={n3}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit category UI fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          git commit -m 'Apply category UI patch'
          git push