name: Build Foodvexa Partner APK
# Rebuild Partner APK with the latest delivery assignment rules/client changes.

on:
  push:
    branches: [main]
    paths:
      - "partner/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-partner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-partner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Partner APK
        run: gradle :partner:assembleDebug
      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Partner-APK
          path: partner/build/outputs/apk/debug/partner-debug.apk
          if-no-files-found: error
