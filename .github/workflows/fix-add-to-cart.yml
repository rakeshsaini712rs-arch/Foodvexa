name: Fix Add to Cart button clipping
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Add to Cart layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s=p.read_text()
          old='''        val add=primaryButton("Add to Cart"){addToCart(p);renderProducts()}\n        add.setTextSize(13f)\n        bottom.addView(add,LinearLayout.LayoutParams(dp(96),dp(44)))'''
          new='''        val add=primaryButton("Add to Cart"){addToCart(p);renderProducts()}\n        add.setTextSize(12f)\n        add.maxLines=2\n        add.ellipsize=null\n        add.minWidth=0\n        add.setPadding(dp(5),dp(4),dp(5),dp(4))\n        bottom.addView(add,LinearLayout.LayoutParams(0,dp(44),1.08f))'''
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          old2='''bottom.addView(label("₹${p.price}",18f,true,Color.WHITE),LinearLayout.LayoutParams(0,dp(44),1f))'''
          new2='''bottom.addView(label("₹${p.price}",18f,true,Color.WHITE),LinearLayout.LayoutParams(0,dp(44),0.92f))'''
          if old2 not in s:
              raise SystemExit('price block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          git diff --cached --quiet || git commit -m "Fix Add to Cart button clipping"
          git push
