name: Apply Add to Cart fix from selected base

on:
  push:
    branches:
      - fix-add-to-cart-from-user-base

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Add to Cart layout
        run: >-
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/foodvexa/app/MainActivity.kt'); s=p.read_text(); old='bottom.addView(add,LinearLayout.LayoutParams(dp(96),dp(44)))'; new='add.setPadding(dp(8),dp(5),dp(8),dp(5)); add.maxLines=2; add.ellipsize=null; bottom.addView(add,LinearLayout.LayoutParams(0,dp(44),0.46f))'; assert old in s, 'Expected Add to Cart layout not found on selected base'; p.write_text(s.replace(old,new,1))"
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Add to Cart button clipping"
          git push origin HEAD:fix-add-to-cart-from-user-base
