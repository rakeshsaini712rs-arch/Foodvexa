name: Apply Add to Cart fix from selected base

on:
  push:
    branches: [fix-add-to-cart-from-user-base]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Add to Cart layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text()
          old = '''    if(qty==0){
        val add=primaryButton("Add to Cart"){addToCart(p);renderProducts()}
        add.setTextSize(13f)
        bottom.addView(add,LinearLayout.LayoutParams(dp(96),dp(44)))
    }else{'''
          new = '''    if(qty==0){
        val add=primaryButton("Add to Cart"){addToCart(p);renderProducts()}
        add.setTextSize(13f)
        add.setPadding(dp(8),dp(5),dp(8),dp(5))
        add.maxLines=2
        add.ellipsize=null
        bottom.addView(add,LinearLayout.LayoutParams(0,dp(44),0.46f))
    }else{'''
          if old not in s:
              raise SystemExit('Expected Add to Cart block was not found; refusing to modify the base.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix Add to Cart button clipping"
          git push origin HEAD:fix-add-to-cart-from-user-base
