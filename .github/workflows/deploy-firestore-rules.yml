name: Deploy Foodvexa Firestore Rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check Firebase service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT repository secret."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Firestore rules only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          node -e "const s=require(process.env.GOOGLE_APPLICATION_CREDENTIALS); if(s.project_id !== 'foodvexa-2daca') process.exit(2)"
          firebase deploy --only firestore:rules --project foodvexa-2daca --non-interactive
