name: Fix product image mismatch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove random image resolver
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r' private fun correctedImageUrl\(p:Product\):String\{.*?\n \}',
              re.DOTALL,
          )
          replacement = ''' private fun correctedImageUrl(p:Product):String{\n  return p.imageUrl\n }'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('correctedImageUrl function not found; refusing to modify source')
          path.write_text(new_text, encoding='utf-8')
          print('Replaced random loremflickr resolver with product imageUrl')

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git commit -m "Use exact product image URLs"
          git push
