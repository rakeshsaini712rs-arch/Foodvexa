name: Fix Available Badge Style

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Available label match reference UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text()
          old = 'label("Available  •  ${p.eta}",11f,true,Color.rgb(50,205,120))'
          new = 'label("• Available",12f,true,Color.rgb(50,205,120))'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "Already fixed"
          else
            git commit -m "Match Available badge style"
            git push
          fi
