name: Build Foodvexa Delivery APK

on:
  push:
    branches: [main, base-881-867]
    paths:
      - "delivery/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Delivery APK
        run: gradle :delivery:assembleDebug
      - name: Upload Delivery APK
        uses: actions/upload-artifact@v4
        with:
          name: Foodvexa-Delivery-APK
          path: delivery/build/outputs/apk/debug/delivery-debug.apk
          if-no-files-found: error
