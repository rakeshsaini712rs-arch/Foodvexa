name: Fix product images to use assigned URLs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace broken image resolver
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/foodvexa/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('loadImage(pic,correctedImageUrl(p))', 'loadImage(pic,p.imageUrl)')
          s = s.replace('loadImage(image,correctedImageUrl(p))', 'loadImage(image,p.imageUrl)')
          marker = 'private fun correctedImageUrl(p:Product):String{'
          start = s.find(marker)
          if start >= 0:
              end = s.find('\n private fun renderProducts()', start)
              if end > start:
                  s = s[:start] + 'private fun correctedImageUrl(p:Product):String = p.imageUrl\n' + s[end:]
          if s != old:
              p.write_text(s, encoding='utf-8')
          else:
              print('No image resolver changes needed.')

      - name: Commit image fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already fixed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/foodvexa/app/MainActivity.kt
          git commit -m 'Fix product images to use assigned product URLs'
          git push

      # Keep this workflow as the single image-source repair step.
