name: Deploy Foodvexa Account Deletion Service

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-account-deletion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-account-deletion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Firebase service account and project
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT repository secret."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(s.project_id !== 'foodvexa-2daca') { console.error('Wrong Firebase project; refusing to deploy.'); process.exit(2); }" "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Deploy account deletion function
        run: firebase deploy --only functions:deleteFoodvexaAccount --project foodvexa-2daca --non-interactive
